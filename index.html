<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PROJET_CASSANDRE</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
        height: 100%;
      }
      #app {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }
      /* L'image interne reste en 16:9. On la contient dans tout format
         d'écran au lieu de l'étirer (les bandes sont remplies par #app). */
      canvas#game,
      canvas.game-overlay,
      #ui-root {
        position: fixed;
        inset: 0;
        margin: auto;
        width: min(100vw, 177.77777778vh);
        height: min(100vh, 56.25vw);
      }
      canvas#game,
      canvas.game-overlay {
        display: block;
        image-rendering: pixelated;
        image-rendering: -moz-crisp-edges;
        image-rendering: crisp-edges;
      }
      #ui-root {
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div id="ui-root"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
