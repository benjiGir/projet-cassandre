<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="740" viewBox="0 0 1120 740" role="img" aria-labelledby="title desc">
<title id="title">Métro — enchaînement simplifié</title><desc id="desc">Les galeries contournent la grille du tunnel A. Le dépôt permet un aller-retour vers le poste et une boucle de machinerie, dans l'ordre choisi, avant d'embarquer dans la rame pour le quai privé et la tour. Schéma d'orientation, sans échelle.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#e4bd80"/></marker></defs>
<style>text{font-family:system-ui,sans-serif;fill:#e7e7d8}.title{font-size:30px;font-weight:650}.node{font-size:19px;font-weight:600}.note{font-size:15px;fill:#aac2c5}.edge{fill:none;stroke:#e4bd80;stroke-width:3;marker-end:url(#arrow)}.room{fill:#243b43;stroke:#577780;stroke-width:2}.warm{fill:#413e30;stroke:#c5a578;stroke-width:2}</style>
<rect width="1120" height="740" fill="#121d25"/>
<text class="title" x="44" y="62">Métro · comprendre le trajet</text><text class="note" x="44" y="94">Schéma sans échelle · la rame relie deux lieux éloignés, ce n’est pas une salle supplémentaire.</text>
<rect class="room" x="44" y="170" width="220" height="86" rx="8"/><text class="node" x="64" y="204">Station → tunnel A</text><text class="note" x="64" y="233">La grille coupe le tunnel</text>
<rect class="room" x="335" y="170" width="215" height="86" rx="8"/><text class="node" x="355" y="204">Galeries de service</text><text class="note" x="355" y="233">Contourner, puis rouvrir A</text>
<path class="edge" d="M264 213H328"/>
<rect class="warm" x="622" y="170" width="190" height="86" rx="8"/><text class="node" x="642" y="204">Dépôt</text><text class="note" x="642" y="233">Deux commandes</text>
<path class="edge" d="M550 213H615"/>
<rect class="room" x="881" y="170" width="195" height="86" rx="8"/><text class="node" x="901" y="204">Rame de service</text><text class="note" x="901" y="233">Porte latérale · départ E</text>
<path class="edge" d="M812 213H874"/>
<text class="note" x="881" y="303">Voyage de 60 secondes</text><path class="edge" d="M976 256V332"/>
<rect class="room" x="881" y="342" width="195" height="86" rx="8"/><text class="node" x="901" y="376">Quai privé</text><text class="note" x="901" y="405">Sortir à droite de la rame</text>
<path class="edge" d="M976 428V482"/>
<rect class="room" x="881" y="492" width="195" height="86" rx="8"/><text class="node" x="901" y="526">Escaliers → tour</text><text class="note" x="901" y="555">Sortie à la surface</text>
<text class="node" x="44" y="337">Au dépôt : deux objectifs, dans l’ordre de votre choix</text>
<rect class="room" x="44" y="405" width="220" height="114" rx="8"/><text class="node" x="64" y="443">Poste d’aiguillage</text><text class="note" x="64" y="472">À l’ouest, par le tunnel B</text><text class="note" x="64" y="497">Puis revenir au dépôt</text>
<rect class="warm" x="342" y="405" width="190" height="114" rx="8"/><text class="node" x="362" y="443">Hall du dépôt</text><text class="note" x="362" y="472">Embarquement au nord</text><text class="note" x="362" y="497">Ateliers sur les côtés</text>
<rect class="room" x="609" y="405" width="220" height="114" rx="8"/><text class="node" x="629" y="443">Machinerie</text><text class="note" x="629" y="472">À l’est, rétablir le courant</text><text class="note" x="629" y="497">Retour par l’accès nord</text>
<path class="edge" marker-start="url(#arrow)" d="M270 462H336"/>
<path class="edge" d="M538 445H603"/><path class="edge" d="M603 493H538"/>
<path d="M718 256V363H437V405" fill="none" stroke="#577780" stroke-width="2" stroke-dasharray="5 6"/>
<text class="note" x="44" y="639">Voies : A continue vers le garage de service. B dessert le garage latéral.</text><text class="note" x="44" y="668">Les flèches représentent le trajet à pied ; les deux commandes autorisent le départ de la rame.</text>
</svg>
